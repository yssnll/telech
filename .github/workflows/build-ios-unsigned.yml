name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native iOS project
        working-directory: artifacts/hls-video-player
        run: pnpm exec expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: artifacts/hls-video-player/ios
        run: pod install

      - name: Archive without code signing
        working-directory: artifacts/hls-video-player
        run: |
          xcodebuild \
            -workspace ios/HLSVideoPlayer.xcworkspace \
            -scheme HLSVideoPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HLSVideoPlayer.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/HLSVideoPlayer-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package the unsigned app as an IPA
        working-directory: artifacts/hls-video-player
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/HLSVideoPlayer.xcarchive/Products/Applications/HLSVideoPlayer.app"
          ipa_dir="$RUNNER_TEMP/unsigned-ipa"

          test -d "$app_path"
          rm -rf "$ipa_dir"
          mkdir -p "$ipa_dir/Payload"
          cp -R "$app_path" "$ipa_dir/Payload/"

          cd "$ipa_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            "$GITHUB_WORKSPACE/HLSVideoPlayer-unsigned.ipa"

          {
            echo "## Unsigned iOS build"
            echo
            echo "The IPA was intentionally built with code signing disabled."
            echo
            echo "It cannot be installed directly on an iPhone until it is signed with an Apple certificate and provisioning profile."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: hls-video-player-unsigned-ipa
          path: HLSVideoPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14