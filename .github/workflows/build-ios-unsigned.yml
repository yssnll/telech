name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      api_domain:
        description: "Domaine public qui expose /api/downloads/mp4 pour les conversions HLS"
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_domain || vars.API_BASE_URL }}

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive without code signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Telech.xcodeproj \
            -scheme Telech \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Telech.xcarchive" \
            API_BASE_URL="${API_BASE_URL:-}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package the unsigned app as an IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Telech.xcarchive/Products/Applications/Telech.app"
          ipa_dir="$RUNNER_TEMP/telech-unsigned-ipa"
          test -d "$app_path"
          rm -rf "$ipa_dir"
          mkdir -p "$ipa_dir/Payload"
          cp -R "$app_path" "$ipa_dir/Payload/"
          cd "$ipa_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            "$GITHUB_WORKSPACE/Telech-unsigned.ipa"

          {
            echo "## iOS build"
            echo
            echo "The IPA was built without Apple code signing."
            echo
            echo "It must be signed with an Apple certificate and provisioning profile before installation on a real iPhone."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: telech-unsigned-ipa
          path: Telech-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
